version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    networks:
      - learnhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - learnhub-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: learnhub-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - learnhub-network

networks:
  learnhub-network:
    driver: bridge